<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2937">
<title>予約管理アプリ</title>

<style>
*{box-sizing:border-box}
body{
margin:0;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Yu Gothic",sans-serif;
background:#f4f6f8;
color:#111827
}
header{
background:#1f2937;
color:#fff;
padding:18px;
text-align:center
}
header h1{margin:0;font-size:24px}
main{max-width:1180px;margin:auto;padding:14px}

.card{
background:#fff;
border-radius:14px;
padding:16px;
margin-bottom:14px;
box-shadow:0 2px 10px rgba(0,0,0,.06)
}

h2{margin:0 0 14px}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.field{
display:flex;
flex-direction:column;
gap:6px
}

.full{grid-column:1/-1}

label{
font-size:14px;
font-weight:700
}

input,select,textarea{
width:100%;
padding:12px;
border:1px solid #d1d5db;
border-radius:10px;
font-size:16px;
background:white
}

.actions,.toolbar,.quick{
display:flex;
gap:8px;
flex-wrap:wrap
}

.actions{margin-top:14px}

button{
border:0;
border-radius:10px;
padding:11px 14px;
font-weight:700;
font-size:14px
}

.primary{
background:#2563eb;
color:white
}

.secondary{
background:#e5e7eb;
color:#111827
}

.danger{
background:#fee2e2;
color:#991b1b
}

.success{
background:#dcfce7;
color:#166534
}

.filters{
display:grid;
grid-template-columns:1.5fr 1fr 1fr;
gap:8px;
margin-bottom:10px
}

.quick{margin-bottom:10px}

.summary{
font-size:14px;
margin:10px 0
}

.status{
display:inline-block;
padding:4px 8px;
border-radius:999px;
font-size:12px;
font-weight:700
}

.s-new{background:#dbeafe;color:#1e40af}
.s-change{background:#fef3c7;color:#92400e}
.s-done{background:#dcfce7;color:#166534}
.s-cancel{background:#fee2e2;color:#991b1b}

.desktop-table{
overflow:auto;
border:1px solid #e5e7eb;
border-radius:10px
}

table{
width:100%;
border-collapse:collapse;
min-width:1000px
}

th,td{
padding:8px;
border-bottom:1px solid #e5e7eb;
border-right:1px solid #eee;
font-size:13px;
text-align:left;
white-space:nowrap
}

th{background:#f3f4f6}

.mobile-list{display:none}

.r-card{
border:1px solid #e5e7eb;
border-radius:12px;
padding:14px;
margin-bottom:10px
}

.r-top{
display:flex;
justify-content:space-between;
gap:10px
}

.r-name{
font-size:18px;
font-weight:800
}

.r-date{
font-size:16px;
font-weight:800;
color:#1d4ed8
}

.r-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-top:12px
}

.r-label{
font-size:12px;
color:#6b7280
}

.r-actions{
display:flex;
gap:8px;
margin-top:12px;
flex-wrap:wrap
}

.tel{
color:#2563eb;
font-weight:700;
text-decoration:none
}

.note{white-space:pre-wrap}

#loginScreen{
max-width:460px;
margin:40px auto
}

.loginBox{
background:white;
padding:22px;
border-radius:16px;
box-shadow:0 2px 12px rgba(0,0,0,.08)
}

.loginBox h2{
text-align:center;
margin-bottom:20px
}

.loginBox input{
margin-bottom:12px
}

.loginBox button{
width:100%
}

.loginStatus{
margin-top:12px;
font-size:14px;
color:#b91c1c;
text-align:center
}

.userbar{
display:flex;
justify-content:space-between;
align-items:center;
gap:10px;
margin-bottom:12px;
font-size:13px
}

.sync{
font-size:13px;
color:#166534;
font-weight:700
}

.hidden{
display:none!important
}

@media(max-width:760px){

.form-grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

.filters{
grid-template-columns:1fr
}

.desktop-table{
display:none
}

.mobile-list{
display:block
}

main{
padding:10px
}

}

@media print{

@page{
size:A4 landscape;
margin:8mm
}

body{
background:white
}

header,
.input-card,
.toolbar,
.filters,
.quick,
.mobile-list,
.no-print,
.userbar{
display:none!important
}

main{
max-width:none;
padding:0
}

.card{
box-shadow:none;
padding:0
}

.desktop-table{
display:block!important;
overflow:visible;
border:0
}

table{
min-width:0;
width:100%;
table-layout:fixed
}

th,td{
font-size:8.5px;
padding:4px;
white-space:normal;
word-break:break-word
}

}
</style>
</head>

<body>

<header>
<h1>予約管理アプリ</h1>
</header>

<div id="loginScreen">

<div class="loginBox">

<h2>ログイン</h2>

<input
id="loginEmail"
type="email"
placeholder="メールアドレス"
autocomplete="username">

<input
id="loginPassword"
type="password"
placeholder="パスワード"
autocomplete="current-password">

<button
id="loginBtn"
class="primary">
ログイン
</button>

<div
id="loginStatus"
class="loginStatus">
</div>

</div>

</div>


<main
id="appScreen"
class="hidden">

<div class="userbar no-print">

<div>

<span class="sync">
● クラウド同期中
</span>

<br>

<span id="userEmail"></span>

</div>

<button
id="logoutBtn"
class="secondary">
ログアウト
</button>

</div>


<section class="card input-card">

<h2>予約入力</h2>

<form id="form">

<input
type="hidden"
id="editId">

<div class="form-grid">

<div class="field">

<label>
お客様名 *
</label>

<input
id="customer"
required>

</div>


<div class="field">

<label>
建物名（アパート） *
</label>

<input
id="building"
required>

</div>


<div class="field">

<label>
部屋番号 *
</label>

<input
id="room"
required>

</div>


<div class="field">

<label>
交換個数 *
</label>

<input
id="count"
type="number"
min="1"
required>

</div>


<div class="field full">

<label>
電話番号 *
</label>

<input
id="phone"
type="tel"
required>

</div>


<div class="field">

<label>
希望日程 *
</label>

<input
id="date"
type="date"
required>

</div>


<div class="field">

<label>
希望時間 *
</label>

<input
id="time"
type="time"
required>

</div>


<div class="field">

<label>
対応状況
</label>

<select id="status">

<option>
未対応
</option>

<option>
日程変更
</option>

<option>
完了
</option>

<option>
キャンセル
</option>

</select>

</div>


<div class="field">

<label>
受付日
</label>

<input
id="received"
type="date">

</div>


<div class="field full">

<label>
備考
</label>

<textarea
id="note"
rows="3">
</textarea>

</div>

</div>


<div class="actions">

<button
class="primary"
type="submit"
id="saveBtn">
予約を登録
</button>

<button
class="secondary"
type="button"
id="clearBtn">
入力クリア
</button>

</div>

</form>

</section>


<section class="card">

<h2>予約一覧</h2>

<div class="filters no-print">

<input
id="search"
placeholder="名前・建物名・電話番号で検索">

<select id="filterStatus">

<option value="">
すべての状況
</option>

<option>未対応</option>
<option>日程変更</option>
<option>完了</option>
<option>キャンセル</option>

</select>


<select id="filterDate">

<option value="all">
すべての日程
</option>

<option value="today">
本日
</option>

<option value="tomorrow">
明日
</option>

<option value="week">
今週
</option>

<option value="future">
今後
</option>

</select>

</div>


<div class="quick no-print">

<button
class="secondary"
data-quick="all">
すべて
</button>

<button
class="secondary"
data-quick="today">
本日
</button>

<button
class="secondary"
data-quick="tomorrow">
明日
</button>

<button
class="secondary"
data-quick="week">
今週
</button>

</div>


<div class="toolbar no-print">

<button
class="secondary"
id="csvBtn">
CSV出力
</button>

<button
class="secondary"
onclick="window.print()">
A4横で印刷
</button>

</div>


<div
class="summary"
id="summary">
</div>


<div
class="mobile-list"
id="mobileList">
</div>


<div class="desktop-table">

<table>

<thead>

<tr>

<th>希望日程</th>

<th>希望時間</th>

<th>お客様名</th>

<th>建物名</th>

<th>部屋番号</th>

<th>交換個数</th>

<th>電話番号</th>

<th>状況</th>

<th>受付日</th>

<th>備考</th>

<th class="no-print">
操作
</th>

</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>

</section>

</main>


<script type="module">

import {
initializeApp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";


import {
getAuth,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
getFirestore,
collection,
addDoc,
doc,
updateDoc,
deleteDoc,
onSnapshot,
serverTimestamp
}
from
"https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


const firebaseConfig = {

apiKey:
"AIzaSyDAojY61XI6ZiCCVkRcQxLRLHK2aI0U3Aw",

authDomain:
"reservation-manager-24352.firebaseapp.com",

projectId:
"reservation-manager-24352",

storageBucket:
"reservation-manager-24352.firebasestorage.app",

messagingSenderId:
"1020898119995",

appId:
"1:1020898119995:web:96c0e1c388fd804f5da71e"

};


const app =
initializeApp(
firebaseConfig
);


const auth =
getAuth(app);


const db =
getFirestore(app);


const $ =
id =>
document.getElementById(id);


let data=[];

let unsubscribe=null;


function esc(v=""){

return String(v)
.replace(
/[&<>"']/g,
m=>({
"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"
}[m])
);

}


function fmtDate(s){

if(!s)
return "";

const p=
s.split("-");

if(p.length!==3)
return s;

return (
p[0]+
"/"+
p[1]+
"/"+
p[2]
);

}


function isoLocal(d){

const z =
n =>
String(n).padStart(2,"0");

return (
d.getFullYear()
+"-"+
z(d.getMonth()+1)
+"-"+
z(d.getDate())
);

}


function inWeek(dateStr){

if(!dateStr)
return false;

const now =
new Date();

now.setHours(0,0,0,0);

const day =
now.getDay() || 7;

const monday =
new Date(now);

monday.setDate(
now.getDate()-day+1
);

const sunday =
new Date(monday);

sunday.setDate(
monday.getDate()+6
);

const d =
new Date(
dateStr+"T00:00:00"
);

return (
d>=monday &&
d<=sunday
);

}


function dateMatch(r,mode){

if(mode==="all")
return true;


const today =
isoLocal(
new Date()
);


const tmr =
new Date();

tmr.setDate(
tmr.getDate()+1
);


const tomorrow =
isoLocal(tmr);


if(mode==="today")
return r.date===today;


if(mode==="tomorrow")
return r.date===tomorrow;


if(mode==="week")
return inWeek(r.date);


if(mode==="future")
return r.date>=today;


return true;

}


function filtered(){

const q =
$("search")
.value
.trim()
.toLowerCase();


const fs =
$("filterStatus").value;


const fd =
$("filterDate").value;


return [...data]

.filter(r =>
(!fs || r.status===fs)
&&
dateMatch(r,fd)
)

.filter(r=>{

if(!q)
return true;

const text =
[
r.customer,
r.building,
r.room,
r.phone,
r.note
]
.join(" ")
.toLowerCase();

return text.includes(q);

})

.sort((a,b)=>{

const A =
(a.date||"")
+" "
+(a.time||"");

const B =
(b.date||"")
+" "
+(b.time||"");

return A.localeCompare(B);

});

}


function sclass(s){

if(s==="完了")
return "s-done";

if(s==="日程変更")
return "s-change";

if(s==="キャンセル")
return "s-cancel";

return "s-new";

}


function render(){

const rows =
filtered();


$("summary").textContent =
"表示件数："
+rows.length+
"件 ／ 登録総数："
+data.length+
"件";


$("tbody").innerHTML =
rows.map(r=>`

<tr>

<td>
${esc(fmtDate(r.date))}
</td>

<td>
${esc(r.time)}
</td>

<td>
${esc(r.customer)}
</td>

<td>
${esc(r.building)}
</td>

<td>
${esc(r.room)}
</td>

<td>
${esc(r.count)}
</td>

<td>
${esc(r.phone)}
</td>

<td>

<span
class="status ${sclass(r.status)}">

${esc(r.status)}

</span>

</td>

<td>
${esc(fmtDate(r.received||""))}
</td>

<td class="note">
${esc(r.note||"")}
</td>

<td class="no-print">

<button
class="secondary"
onclick="editRow('${r.id}')">
編集
</button>

<button
class="danger"
onclick="deleteRow('${r.id}')">
削除
</button>

</td>

</tr>

`).join("");


$("mobileList").innerHTML =
rows.map(r=>`

<div class="r-card">

<div class="r-top">

<div>

<div class="r-name">
${esc(r.customer)}
</div>

<div>
${esc(r.building)}
${esc(r.room)}
</div>

</div>


<div style="text-align:right">

<div class="r-date">
${esc(fmtDate(r.date))}
</div>

<div style="font-weight:800">
${esc(r.time)}
</div>

</div>

</div>


<div class="r-grid">

<div>

<div class="r-label">
交換個数
</div>

<strong>
${esc(r.count)}個
</strong>

</div>


<div>

<div class="r-label">
対応状況
</div>

<span
class="status ${sclass(r.status)}">

${esc(r.status)}

</span>

</div>


<div>

<div class="r-label">
電話番号
</div>

<a
class="tel"
href="tel:${esc(r.phone)}">

${esc(r.phone)}

</a>

</div>


<div>

<div class="r-label">
受付日
</div>

${esc(fmtDate(r.received||""))}

</div>

</div>


${r.note ? `

<div style="margin-top:10px">

<div class="r-label">
備考
</div>

<div class="note">
${esc(r.note)}
</div>

</div>

` : ""}


<div class="r-actions">

<a href="tel:${esc(r.phone)}">

<button
class="success"
type="button">

電話する

</button>

</a>


<button
class="secondary"
type="button"
onclick="editRow('${r.id}')">

編集

</button>


<button
class="danger"
type="button"
onclick="deleteRow('${r.id}')">

削除

</button>

</div>

</div>

`).join("");

}


function clearForm(){

$("form").reset();

$("editId").value="";

$("status").value="未対応";

$("saveBtn").textContent =
"予約を登録";

$("received").value =
isoLocal(
new Date()
);

}


$("loginBtn")
.addEventListener(
"click",
async ()=>{

$("loginStatus")
.textContent =
"ログイン中...";


try{

await signInWithEmailAndPassword(
auth,
$("loginEmail").value.trim(),
$("loginPassword").value
);

$("loginStatus")
.textContent="";

}
catch(e){

console.error(e);

$("loginStatus")
.textContent =
"メールアドレスまたはパスワードを確認してください。";

}

});


$("loginPassword")
.addEventListener(
"keydown",
e=>{

if(e.key==="Enter")
$("loginBtn").click();

});


$("logoutBtn")
.addEventListener(
"click",
async ()=>{

await signOut(auth);

});


onAuthStateChanged(
auth,
user=>{

if(unsubscribe){

unsubscribe();

unsubscribe=null;

}


if(user){

$("loginScreen")
.classList.add("hidden");

$("appScreen")
.classList.remove("hidden");

$("userEmail")
.textContent =
user.email || "";


const reservations =
collection(
db,
"reservations"
);


unsubscribe =
onSnapshot(
reservations,
snapshot=>{

data =
snapshot.docs.map(d=>({

id:d.id,
...d.data()

}));

render();

},
error=>{

console.error(error);

alert(
"予約データを読み込めませんでした。Firestore設定を確認してください。"
);

}
);


clearForm();

}
else{

data=[];

$("appScreen")
.classList.add("hidden");

$("loginScreen")
.classList.remove("hidden");

$("loginPassword").value="";

render();

}

});


$("form")
.addEventListener(
"submit",
async e=>{

e.preventDefault();


if(!auth.currentUser){

alert(
"ログインしてください。"
);

return;

}


const editId =
$("editId").value;


const rec = {

customer:
$("customer").value.trim(),

building:
$("building").value.trim(),

room:
$("room").value.trim(),

count:
$("count").value,

phone:
$("phone").value.trim(),

date:
$("date").value,

time:
$("time").value,

status:
$("status").value,

received:
$("received").value,

note:
$("note").value.trim(),

updatedAt:
serverTimestamp(),

updatedBy:
auth.currentUser.email || ""

};


try{

if(editId){

await updateDoc(
doc(
db,
"reservations",
editId
),
rec
);

}
else{

rec.createdAt =
serverTimestamp();

rec.createdBy =
auth.currentUser.email || "";


await addDoc(
collection(
db,
"reservations"
),
rec
);

}


clearForm();

}
catch(e){

console.error(e);

alert(
"予約を保存できませんでした。"
);

}

});


$("clearBtn")
.addEventListener(
"click",
clearForm
);


window.editRow =
id=>{

const r =
data.find(
x=>x.id===id
);

if(!r)
return;


$("editId").value=r.id;

$("customer").value=
r.customer||"";

$("building").value=
r.building||"";

$("room").value=
r.room||"";

$("count").value=
r.count||"";

$("phone").value=
r.phone||"";

$("date").value=
r.date||"";

$("time").value=
r.time||"";

$("status").value=
r.status||"未対応";

$("received").value=
r.received||"";

$("note").value=
r.note||"";


$("saveBtn")
.textContent =
"変更を保存";


window.scrollTo({
top:0,
behavior:"smooth"
});

};


window.deleteRow =
async id=>{

if(
!confirm(
"この予約を削除しますか？"
)
)
return;


try{

await deleteDoc(
doc(
db,
"reservations",
id
)
);

}
catch(e){

console.error(e);

alert(
"予約を削除できませんでした。"
);

}

};


$("search")
.addEventListener(
"input",
render
);


$("filterStatus")
.addEventListener(
"change",
render
);


$("filterDate")
.addEventListener(
"change",
render
);


document
.querySelectorAll(
"[data-quick]"
)
.forEach(btn=>{

btn.addEventListener(
"click",
()=>{

$("filterDate").value =
btn.dataset.quick;

render();

}
);

});


$("csvBtn")
.addEventListener(
"click",
()=>{

const rows =
filtered();


const header = [

"お客様名",
"建物名",
"部屋番号",
"交換個数",
"電話番号",
"希望日程",
"希望時間",
"対応状況",
"受付日",
"備考"

];


const csvData = [

header,

...rows.map(r=>[

r.customer,
r.building,
r.room,
r.count,
r.phone,
r.date,
r.time,
r.status,
r.received||"",
r.note||""

])

];


const csv =
csvData
.map(
row=>
row.map(
v=>
'"'
+
String(v??"")
.replace(/"/g,'""')
+
'"'
)
.join(",")
)
.join("\r\n");


const blob =
new Blob(
["\uFEFF"+csv],
{
type:
"text/csv;charset=utf-8;"
}
);


const a =
