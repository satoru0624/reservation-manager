<style>

font-size:14px;

function esc(v=""){

return String(v)
.replace(
/[&<>"']/g,
m=>({

"&":"&amp;",
"<":"&lt;",
">":"&gt;",
'"':"&quot;",
"'":"&#39;"

}[m])
);

}


function fmtDate(s){

if(!s)
return "";

const p=
s.split("-");

return p.length===3
?
`${p[0]}/${p[1]}/${p[2]}`
:
s;

}


function isoLocal(d){

const z=
n=>
String(n).padStart(2,"0");

return (
d.getFullYear()
+"-"+
z(d.getMonth()+1)
+"-"+
z(d.getDate())
);

}


function nowText(){

const d=
new Date();

const z=
n=>
String(n).padStart(2,"0");

return (

d.getFullYear()
+"/"+
z(d.getMonth()+1)
+"/"+
z(d.getDate())
+" "+
z(d.getHours())
+":"+
z(d.getMinutes())

);

}


function inWeek(s){

if(!s)
return false;


const n=
new Date();

n.setHours(
0,
0,
0,
0
);


const day=
n.getDay() || 7;


const m=
new Date(n);

m.setDate(
n.getDate()-day+1
);


const su=
new Date(m);

su.setDate(
m.getDate()+6
);


const d=
new Date(
s+"T00:00:00"
);


return (
d>=m &&
d<=su
);

}


function dateMatch(r,m){

if(m==="all")
return true;


const t=
isoLocal(
new Date()
);


const x=
new Date();

x.setDate(
x.getDate()+1
);


if(m==="today")
return r.date===t;


if(m==="tomorrow")
return r.date===isoLocal(x);


if(m==="week")
return inWeek(r.date);


if(m==="future")
return r.date>=t;


return true;

}


function activeRows(){

return data.filter(
r=>!r.isDeleted
);

}


function deletedRows(){

return data.filter(
r=>r.isDeleted
);

}


function filtered(){

let rows=
viewMode==="trash"
?
deletedRows()
:
activeRows();


if(viewMode==="trash"){

return [...rows]
.sort(
(a,b)=>
(b.deletedAtText||"")
.localeCompare(
a.deletedAtText||""
)
);

}


const q=
$("search")
.value
.trim()
.toLowerCase();


const fs=
$("filterStatus").value;


const fd=
$("filterDate").value;


return [...rows]

.filter(
r=>
(!fs || r.status===fs)
&&
dateMatch(r,fd)
)

.filter(
r=>
!q
||
[
r.customer,
r.building,
r.room,
r.phone,
r.note
]
.join(" ")
.toLowerCase()
.includes(q)
)

.sort(
(a,b)=>
(
(a.date||"")
+" "+
(a.time||"")
)
.localeCompare(
(b.date||"")
+" "+
(b.time||"")
)
);

}


function statusSelect(r){

return `

<select
class="status-select"
onchange="quickStatus('${r.id}',this.value)">

${STATUS_OPTIONS
.map(
s=>
`
<option
${s===r.status ? "selected" : ""}>
${s}
</option>
`
)
.join("")}

</select>

`;

}


function historyHtml(r){

const h=
Array.isArray(r.history)
?
[...r.history].reverse()
:
[];


if(!h.length)
return "";


return `

<details class="history-box">

<summary>
変更履歴（${h.length}件）
</summary>

${h.map(
x=>
`

<div class="history-item">

<span class="history-time">
${esc(x.at||"")}
</span>

<br>

${esc(x.message||"")}

<br>

<span class="history-time">
${esc(x.by||"")}
</span>

</div>

`
).join("")}

</details>

`;

}

<td>${esc(r.building)}</td>

:
`

function diffMessage(o,n){

const map={

customer:"お客様名",
building:"建物名",
room:"部屋番号",
count:"交換個数",
phone:"電話番号",
date:"希望日程",
time:"希望時間",
status:"対応状況",
received:"受付日",
note:"備考"

};


const c=[];


for(
const [k,l]
of Object.entries(map)
){

const a=
String(
o?.[k] ?? ""
);

const b=
String(
n?.[k] ?? ""
);


if(a!==b){

c.push(
`${l}: ${a||"（空欄）"} → ${b||"（空欄）"}`
);

}

}


return (
c.join(" / ")
||
"内容を更新"
);

}

$("csvBtn")
.onclick=
()=>{

const rows=
filtered();


const head=[

"お客様名",
"建物名",
"部屋番号",
"交換個数",
"電話番号",
"希望日程",
"希望時間",
"対応状況",
"受付日",
"備考"

];


const all=[

head,

...rows.map(
r=>[

r.customer,
r.building,
r.room,
r.count,
r.phone,
r.date,
r.time,
r.status,
r.received || "",
r.note || ""

]
)

];


const csv=
all.map(
row=>
row.map(
v=>
`"${String(v??"").replace(/"/g,'""')}"`
)
.join(",")
)
.join("\r\n");


const blob=
new Blob(

[
"\uFEFF"+csv
],

{
type:
"text/csv;charset=utf-8;"
}

);


const a=
document.createElement(
"a"
);


a.href=
URL.createObjectURL(
blob
);


a.download=
`予約一覧_${isoLocal(new Date())}.csv`;


a.click();


URL.revokeObjectURL(
a.href
);

};


clearForm();

</script>
